# nginx site config for Fischer's front-end VM.
# Install: sudo cp deploy/nginx/fischer.conf /etc/nginx/sites-available/fischer
#          sudo ln -s /etc/nginx/sites-available/fischer /etc/nginx/sites-enabled/fischer
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/fischer;
    index index.html;

    # Separate log files for this site (used for monitoring in later milestones)
    access_log /var/log/nginx/fischer_access.log;
    error_log  /var/log/nginx/fischer_error.log;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Milestone 2: forward API requests to the back-end VM, for example:
    # location /api/ {
    #     proxy_pass http://<backend-vm-ip>:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
