# nginx site config for Fischer's front-end VM (10.10.0.10).
# Serves the web pages and forwards /api/ requests to the back-end VM over the VLAN.
# Installed by: sudo bash deploy/frontend-deploy.sh

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/fischer;
    index index.html;

    # Basic system logs for this site
    access_log /var/log/nginx/fischer_access.log;
    error_log  /var/log/nginx/fischer_error.log;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    client_max_body_size 64k;

    location / {
        try_files $uri $uri/ =404;
    }

    # Reverse proxy: the browser only ever talks to this VM. nginx passes API
    # calls to the back end (Node.js on 10.10.0.20:3000), which isn't reachable
    # from outside the VLAN.
    location /api/ {
        proxy_pass http://10.10.0.20:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
